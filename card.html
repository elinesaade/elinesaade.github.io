<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eline Saade</title>
<meta name="description" content="Eline Saade — art director, illustrator & visual storyteller.">
<meta name="theme-color" content="#1a0b33">
<style>
@font-face{font-family:"Metropolis";src:url(assets/fonts/Metropolis-Regular.otf) format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Metropolis";src:url(assets/fonts/Metropolis-Medium.otf) format("opentype");font-weight:500;font-display:swap}
@font-face{font-family:"Metropolis";src:url(assets/fonts/Metropolis-SemiBold.otf) format("opentype");font-weight:600;font-display:swap}
@font-face{font-family:"Metropolis";src:url(assets/fonts/Metropolis-ExtraBold.otf) format("opentype");font-weight:800;font-display:swap}
:root{--bg:#1a0b33;--card:rgba(42,21,73,.72);--edge:rgba(185,140,255,.28);--ink:#f6efff;--muted:#c8b6e8;--sun:#CDB8FF;--lilac:#b98cff}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:radial-gradient(120% 80% at 50% 0%,#3a1c6b 0%,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font-family:"Metropolis",system-ui,sans-serif;display:grid;place-items:center;padding:calc(28px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px));min-height:100svh;overflow-x:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.card{position:relative;z-index:1;width:min(100%,400px);background:var(--card);border:1px solid var(--edge);border-radius:28px;padding:28px 22px 24px;text-align:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
.avatar{width:190px;height:auto;display:block;margin:-6px auto 6px;filter:drop-shadow(0 10px 24px rgba(185,140,255,.45))}
@media (prefers-reduced-motion:no-preference){.avatar{animation:bob 4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}}
h1{font-family:"Metropolis",system-ui,sans-serif;font-weight:800;font-size:2.1rem;letter-spacing:-.02em;line-height:1.05}
.role{margin-top:8px;color:var(--muted);font-size:1rem;line-height:1.4}
.hand{font-family:"Metropolis",system-ui,sans-serif;color:var(--sun);font-size:1.1rem;margin:12px 0 20px}
.links{display:grid;gap:10px}
.links a{display:flex;align-items:center;gap:14px;padding:15px 18px;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.04);color:var(--ink);text-decoration:none;font-weight:600;font-size:1.02rem;transition:transform .2s,border-color .2s,background .2s}
.links a:hover,.links a:focus-visible{transform:translateY(-2px);border-color:var(--sun);background:rgba(205,184,255,.1);outline:none}
.links a svg{width:22px;height:22px;flex:none}
.links a span{flex:1;text-align:left}
.links a small{color:var(--muted);font-weight:500;font-size:.8rem}
.links a.soon{border-style:dashed;opacity:.6;pointer-events:none}
.links a.main{background:var(--sun);color:#2a1549;border-color:var(--sun)}
.links a.main small{color:#5a3f80}
.save{margin-top:16px;background:none;border:0;color:var(--lilac);font:600 .9rem "Metropolis",system-ui,sans-serif;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main class="card">
  <img class="avatar" src="assets/eline_purple.webp" alt="" width="886" height="639">
  <h1 id="name">Eline Saade</h1>
  <p class="role" id="role">Art director, illustrator &amp; visual storyteller</p>
  <p class="hand" id="intro">I invent worlds people want to step into.</p>
  <nav class="links">
    <a class="main" href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg><span>See my portfolio</span></a>
    <a data-link="instagram" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg><span>Instagram</span><small>soon</small></a>
    <a data-link="linkedin" href="#"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM3 9.5h4V21H3zM9.5 9.5h3.8v1.6h.06c.53-1 1.83-2.06 3.77-2.06 4.03 0 4.77 2.65 4.77 6.1V21h-4v-5.1c0-1.22-.02-2.78-1.7-2.78-1.7 0-1.96 1.33-1.96 2.7V21h-4z"/></svg><span>LinkedIn</span><small>soon</small></a>
    <a data-link="website" href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>Website</span><small>soon</small></a>
    <a data-link="email" href="#" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg><span>Email</span><small></small></a>
  </nav>
  <button class="save" id="save" type="button">Save to contacts</button>
</main>
<script src="site-info.js"></script>
<script>
(function(){
  var I=window.SITE_INFO||{};
  if(I.name){document.getElementById('name').textContent=I.name;document.title=I.name}
  if(I.role)document.getElementById('role').textContent=I.role;
  if(I.intro)document.getElementById('intro').textContent=I.intro;
  document.querySelectorAll('[data-link]').forEach(function(a){
    var k=a.dataset.link,v=(I[k]||'').trim(),s=a.querySelector('small');
    if(!v){a.classList.add('soon');a.removeAttribute('href');return}
    a.hidden=false;
    if(k==='email'){a.href='mailto:'+v;s.textContent=v}
    else{a.href=v;a.target='_blank';a.rel='noopener';s.textContent=v.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'')}
  });
  document.getElementById('save').onclick=function(){
    var n=(I.name||'Eline Saade'),p=n.split(' ');
    var v=['BEGIN:VCARD','VERSION:3.0','N:'+(p.slice(1).join(' ')||'')+';'+p[0]+';;;','FN:'+n,'TITLE:'+(I.role||'')];
    if(I.email)v.push('EMAIL:'+I.email);
    v.push('URL:'+location.origin+location.pathname.replace(/card\.html$/,''));
    ['instagram','linkedin','website'].forEach(function(k){if(I[k])v.push('URL;type='+k+':'+I[k])});
    v.push('END:VCARD');
    var b=new Blob([v.join('\r\n')],{type:'text/vcard'}),a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=n.replace(/\s+/g,'_')+'.vcf';document.body.appendChild(a);a.click();a.remove();
  };
  // starfield
  var c=document.getElementById('sky'),x=c.getContext('2d'),S=[],W,H,d=Math.min(devicePixelRatio||1,2);
  function rs(){W=c.width=innerWidth*d;H=c.height=innerHeight*d;S=[];for(var i=0;i<Math.round(innerWidth*innerHeight/5000);i++)S.push({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.2+.3)*d,p:Math.random()*6.28})}
  rs();addEventListener('resize',rs);
  var still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function f(t){x.clearRect(0,0,W,H);S.forEach(function(s){var a=.35+.45*Math.sin(s.p+(still?0:t/900));x.globalAlpha=a;x.fillStyle='#fff';x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill()});if(!still)requestAnimationFrame(f)})(0);
})();
</script>
</body>
</html>
